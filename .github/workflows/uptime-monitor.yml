name: Connect uptime monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: connect-uptime-monitor
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check public site and auth status endpoint
        id: probe
        continue-on-error: true
        env:
          SITE_URL: https://connect-web-7ypt.onrender.com
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          (async () => {
            const base = process.env.SITE_URL;
            const targets = [base, new URL("/api/auth/status", base).toString()];
            const failures = [];
            for (const target of targets) {
              try {
                const response = await fetch(target, {
                  redirect: "follow",
                  signal: AbortSignal.timeout(20000),
                  headers: { "user-agent": "Connect-Uptime-Monitor/1.0" },
                });
                if (!response.ok) failures.push(`${target} returned HTTP ${response.status}`);
                else if (target.endsWith("/api/auth/status")) {
                  const body = await response.json();
                  if (typeof body.configured !== "boolean") failures.push("Auth status endpoint returned an unexpected response");
                }
              } catch (error) {
                failures.push(`${target} failed: ${error.name || "request error"}`);
              }
            }
            const summary = failures.length ? failures.join("; ") : "Both public endpoints returned healthy responses.";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `summary<<EOF\n${summary}\nEOF\n`);
            if (failures.length) {
              console.error(summary);
              process.exitCode = 1;
            } else {
              console.log(summary);
            }
          })();
          NODE
      - name: Open or retain an incident issue when checks fail
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.probe.outputs.summary }}
        with:
          script: |
            const title = "Connect uptime monitor detected an outage";
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = openIssues.find(issue => issue.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  "The scheduled uptime monitor could not verify the public Connect site and/or auth-status endpoint.",
                  "",
                  process.env.SUMMARY || "No additional probe details were recorded.",
                  "",
                  `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  "",
                  "Investigate Render service health and logs. Do not include credentials, session cookies, or personal data in this issue."
                ].join("\n")
              });
            }
      - name: Close the incident issue after recovery
        if: steps.probe.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Connect uptime monitor detected an outage";
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = openIssues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "The scheduled monitor has recovered: both public endpoints returned healthy responses. Please review the incident timeline before closing related operational follow-ups."
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed"
              });
            }
