name: Connect security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm to current stable release
        run: npm install --global npm@11
      - name: Prepare lockfile for audit
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check for accidentally committed environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$'; then
            echo 'Unexpected tracked .env file detected.'
            exit 1
          fi
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
