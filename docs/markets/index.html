<style id="connect-sitewide-no-white-pills">
/* CONNECT SITEWIDE DARK-GLASS SURFACE + NO-WHITE-PILLS THEME */
:root{color-scheme:dark;--connect-night:#020a2a;--connect-deep:#06143d;--connect-panel:#0a2052;--connect-blue:#087cff;--connect-cyan:#00d9ff;--connect-text:#f5f9ff;--connect-muted:#c4d8f7;--connect-border:rgba(93,190,255,.42)}
html,body{background-color:var(--connect-night)!important;color:var(--connect-text)!important}
body{background-image:radial-gradient(ellipse at 50% -8%,rgba(22,77,203,.42),transparent 42%),linear-gradient(135deg,#020a2a,#06143d 58%,#101d50)!important}
:where(button,[role="button"],input[type="button"],input[type="submit"],input[type="reset"],.button,.btn,.primary,.navButton,.filterReset,.viewer-actions a,.viewer-actions button){background:linear-gradient(110deg,#087cff,#087eae 52%,#00bddd)!important;color:#fff!important;border:1px solid #48cfff!important;box-shadow:0 8px 22px rgba(0,110,255,.2)!important;border-radius:12px;font-weight:800}
:where(.pill,.badge,.chip,.tag,.status,.eyebrow,.filter-chip,.category-pill,.nav-pill,.count-badge){background:linear-gradient(110deg,#103a7b,#123e78 55%,#25336d)!important;color:#eaf7ff!important;border:1px solid rgba(93,190,255,.48)!important}
:where(.card,.kpi,.score-card,.scorecard,.stat-card,.feature-card,.info-card,.profile-card,.dashboard-card,.result-card,.summary-card,.metric-card,.tile,.topic,.panel,.post,.composer,.story,.notice,.feed,.community,.metrics,.join,.proof,.campaign,.builder,.how,.discovery-tools,.app-card,.service-card,.viewer-panel,.viewer-head,.viewer-foot,.provider-fallback,.side-note,.search-history,.empty-state,[class*="scoreCard"],[class*="score-card"],[class*="ScoreCard"]){background:linear-gradient(145deg,rgba(12,36,86,.97),rgba(7,22,61,.98) 58%,rgba(16,29,80,.97))!important;color:var(--connect-text)!important;border-color:var(--connect-border)!important;box-shadow:0 14px 38px rgba(0,5,28,.3)!important}
:where(.card,.kpi,.score-card,.scorecard,.stat-card,.feature-card,.info-card,.profile-card,.dashboard-card,.result-card,.summary-card,.metric-card,.tile,.topic,.panel,.post,.composer,.story,.notice,.feed,.community,.metrics,.join,.proof,.campaign,.builder,.how,.discovery-tools,.app-card,.service-card,.viewer-panel,.viewer-head,.viewer-foot,.provider-fallback,.side-note,.search-history,.empty-state){color:var(--connect-text)!important}
:where(input,select,textarea){background:#071b4b!important;color:#f5f9ff!important;border:1px solid #3865a5!important}
:where(input,select,textarea)::placeholder{color:#a9c7ef!important;opacity:1}
:where(h1,h2,h3,h4,h5,h6,strong,b,th,legend){color:#fff}
:where(p,li,label,small,figcaption,.muted,.description,.meta,.helper,.note,.footrow){color:var(--connect-muted)}
:where(.topbar,.top,.topbar,.header,.videoHeader,.vHeader,.connectHeader,.siteHeader,.shell>header){background:rgba(3,13,48,.94)!important;color:#f5f9ff!important;border-color:var(--connect-border)!important;backdrop-filter:blur(16px)}
:where(.menuToggle,.mobileMenuToggle,.close,.viewer-close){background:linear-gradient(110deg,#087cff,#00bddd)!important;color:#fff!important}
img,video,canvas,svg{background-color:transparent}
</style>
