services:
  - type: web
    name: connect-web
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_APPWRITE_ENDPOINT
        sync: false
      - key: NEXT_PUBLIC_APPWRITE_PROJECT_ID
        sync: false
      - key: APPWRITE_API_KEY
        sync: false
      - key: APPWRITE_ACCESS_DATABASE_ID
        sync: false
      - key: APPWRITE_MEMBER_ACCESS_COLLECTION_ID
        sync: false
